# One machine, always exactly one: the relay and the channel's roster live in
# this process's memory. Deploy with `fly deploy --ha=false` and never scale
# the count above 1.
app = "tall-channel"
primary_region = "lhr"

[env]
  PORT = "8080"
  STATIC_DIR = "/srv"

# Fly terminates TLS and forwards HTTP and the relay's WebSockets. The machine
# is always running, so nobody waits for it to start.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Every member holds one long-lived relay WebSocket.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

# A full channel forwards about 100 Mbit/s of video through the relay.
[[vm]]
  size = "shared-cpu-2x"
  memory = "512mb"
